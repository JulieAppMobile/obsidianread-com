<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Obsidian Read — Romances qui tiennent éveillées</title>
<meta name="description" content="Obsidian Read — Application de lecture de romances : enemies-to-lovers, slow burn, dark academia. Disponible sur iOS et Android." />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0E0A0C;
    color: #F5F1E8;
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
  }
  a { color: #DC3C82; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .container { max-width: 720px; margin: 0 auto; padding: 60px 24px; }
  header { text-align: center; padding: 80px 24px 40px; }
  .logo {
    width: 88px; height: 88px;
    border-radius: 22px;
    background: radial-gradient(120% 120% at 30% 20%, #DC3C82 0%, #6B0F2A 55%, #2A0F1A 100%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    margin-bottom: 24px;
  }
  .logo span {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 56px;
    color: #FFE6D7;
    line-height: 1;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1;
  }
  .tagline {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: #DC3C82;
    font-size: 18px;
    margin-top: 12px;
    letter-spacing: 2px;
  }
  .nav {
    text-align: center;
    padding: 40px 24px;
    border-top: 1px solid #2A2326;
    margin-top: 60px;
  }
  .nav a {
    margin: 0 16px;
    font-size: 14px;
    color: #C9C4BC;
  }
  .footer {
    text-align: center;
    padding: 24px;
    color: #6B6368;
    font-size: 12px;
  }
  .badges {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 32px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    padding: 8px 18px;
    border: 1px solid #2A2326;
    background: #1A1416;
    border-radius: 999px;
    font-size: 13px;
    color: #C9C4BC;
  }
</style>
</head>
<body>
<header>
  <div class="logo"><span>Or</span></div>
  <h1>Obsidian Read</h1>
  <div class="tagline">Écrit pour la nuit.</div>
  <div class="badges">
    <div class="badge">📱 Bientôt sur iOS</div>
    <div class="badge">📱 Bientôt sur Android</div>
  </div>
</header>

<div class="nav">

  <a href="mailto:contact@obsidianread.com">Contact</a>
</div>

<div class="footer">
  © 2026 Obsidian Read. Tous droits réservés.
</div>
</body>
</html>
